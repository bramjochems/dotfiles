# overview.conf: which folders /status overview scans. Read by overview.py.
#
# One setting per line: `<keyword> <path>`; `~` is your home; `#` starts a comment.
#
#   root <path>      scan this folder's subfolders for projects (nested ones too, e.g. medi-invest/website,
#                    rawc/website/rawc), down to `depth` levels. A root that is itself a git repo is one project.
#   exclude <path>   never a project, and its sessions are not counted (the path and everything below it).
#   depth <n>        how many folder levels below a root to look for repos (default 4).
#
# What counts as a project: a git repo (a folder with a .git directory), or a folder under a root with
# Claude sessions in the last 90 days. Not configurable, so every view agrees:
#   - worktrees (a .git file: sibling checkouts such as rawc/stocktimal-int338, and <repo>/.claude/worktrees/*)
#     are counted under their main repo, never on their own line;
#   - a root itself, a folder that holds other projects (medi-invest/lcct), and a folder that no longer
#     exists go on the "Other" line, with their sessions and hours.

root ~/projects
root ~/homelab

exclude ~/projects/meta/overview/agent-kit-recovered

depth 4
